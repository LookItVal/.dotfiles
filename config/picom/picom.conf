#################################
#            Backend            #
#################################
backend = "glx";
# Note: "opengl-swc" was deprecated in modern picom. 
# Use standard boolean VSync with the GLX backend.
vsync = true;

#################################
#            Shadows            #
#################################
# Replaces -c and --shadow-exclude
shadow = true;

#################################
#            Fading             #
#################################
# Replaces -f and --no-fading-openclose
fading = true;
no-fading-openclose = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;

#################################
#          Animations           #
#################################
# Presets from picom v13. With animations defined, no-fading-openclose has no effect.
animations = (
  {
    # Closing window shrinks slightly and fades out.
    # "hide" is deliberately not here: i3 unmaps windows on workspace switch, which picom sees as hide.
    triggers = [ "close" ];
    preset = "disappear";
    scale = 0.9;
    duration = 0.15;
  },
  {
    # Remaining tiles glide/scale to their new position (EXPERIMENTAL)
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.2;
  }
);

#################################
#          Performance          #
#################################
# Replaces --unredir-if-possible
unredir-if-possible = true;
unredirect-redirected-fullscreen = true;
use-damage = true;

#################################
#            Borders            #
#################################
corner-radius = 6;
round-borders = 1;


##################################
#            Opacity            #
#################################
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 3;

#################################
#             Rules             #
#################################
rules: (
  {
    match = "(class_g = 'URxvt' || class_g = 'Alacritty') && !focused";
    opacity = 0.80;
  },
  {
    match = "(class_g = 'URxvt' || class_g = 'Alacritty') && focused";
    opacity = 0.90;
  },
  {
    match = "class_g = 'URxvt' || class_g = 'i3bar'";
    corner-radius = 0;
  },
  # Match rofi's own `border-radius: 10px` (rofi/config.rasi) so the shadow + blur get the same corners
  {
    match = "class_g = 'Rofi'";
    corner-radius = 10;
    # Pop-up on open (close animation comes from the global animations block)
    animations = (
      {
        triggers = [ "open" ];
        preset = "appear";
        scale = 0.8;
        duration = 0.12;
      }
    );
  },
  # Dunst notifications. All notifications live in ONE X window, so picom animates the window, not
  # each notification. Gaps (gap_size in dunstrc) are transparent, so blur/shadow/corner-radius are
  # off here: they'd be applied to the whole stack as a single slab. Dunst draws its own rounded corners.
  {
    match = "class_g = 'Dunst'";
    corner-radius = 0;
    shadow = false;
    blur-background = false;
    animations = (
      {
        # Pop in: scale up from 60% (about the window centre) while fading in
        triggers = [ "open" ];
        tmp-s = {
          curve = "cubic-bezier(0.2, 0.9, 0.3, 1.2)";
          duration = 0.25;
          start = 0.6;
          end = 1;
        };
        scale-x = "tmp-s";
        scale-y = "tmp-s";
        offset-x = "window-width * (1 - tmp-s) / 2";
        offset-y = "window-height * (1 - tmp-s) / 2";
        opacity = {
          curve = "linear";
          duration = 0.15;
          start = 0;
          end = 1;
        };
      },
      {
        # Slide out to the right while shrinking and fading
        triggers = [ "close", "hide" ];
        tmp-t = {
          curve = "cubic-bezier(0.5, 0, 0.9, 0.5)";
          duration = 0.25;
          start = 0;
          end = 1;
        };
        scale-x = "1 - 0.5 * tmp-t";
        scale-y = "1 - 0.5 * tmp-t";
        # right edge stays put during the shrink, then the whole thing drifts right
        offset-x = "window-width * 0.5 * tmp-t + 80 * tmp-t";
        offset-y = "window-height * 0.25 * tmp-t";
        opacity = "1 - tmp-t";
        shadow-opacity = "1 - tmp-t";
      },
      {
        # Stack grows/shrinks: glide to the new geometry
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.2;
      }
    );
  },
  {
    match = "class_g = 'wbar'";
    shadow = false;
  },
  # Prevent Picom shadows on GTK popups/utility menus that draw CSD
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'utility' || window_type = 'tooltip'";
    shadow = false;
    # Menus pad their window with invisible margins for a self-drawn shadow; blurring the whole
    # window made the blur spill 5–50+px past the visible menu. They're opaque anyway.
    blur-background = false;
  },
  
  # Remove shadows on GTK Client-Side Decorated windows if they carry invisible margins
  {
    match = "_GTK_FRAME_EXTENTS@";
    shadow = false;
    blur-background = false;   # same invisible-margin issue as menus
  }
);

