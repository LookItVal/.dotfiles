#################################
#            Backend            #
#################################
backend = "glx";
# Note: "opengl-swc" was deprecated in modern picom. 
# Use standard boolean VSync with the GLX backend.
vsync = true;

#################################
#            Shadows            #
#################################
# Replaces -c and --shadow-exclude
shadow = true;

#################################
#            Fading             #
#################################
# Replaces -f and --no-fading-openclose
fading = true;
no-fading-openclose = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 10;

#################################
#          Performance          #
#################################
# Replaces --unredir-if-possible
unredir-if-possible = true;
unredirect-redirected-fullscreen = true;
use-damage = true;

#################################
#            Borders            #
#################################
corner-radius = 0;

#################################
#             Rules             #
#################################
rules: (
  {
    match = "(class_g = 'URxvt' || class_g = 'Alacritty') && !focused";
    opacity = 0.85;
  },
  {
    match = "(class_g = 'URxvt' || class_g = 'Alacritty') && focused";
    opacity = 0.95;
  },
  {
    match = "class_g = 'URxvt' || class_g = 'i3bar' || class_g = 'Rofi'";
    corner-radius = 0;
  },
  {
    match = "class_g = 'wbar'";
    shadow = false;
  },
  # Prevent Picom shadows on GTK popups/utility menus that draw CSD
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'menu' || window_type = 'utility' || window_type = 'tooltip'";
    shadow = false;
  },
  
  # Remove shadows on GTK Client-Side Decorated windows if they carry invisible margins
  {
    match = "_GTK_FRAME_EXTENTS@";
    shadow = false;
  }
);

